<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사진 정리</title>
<link rel="stylesheet" href="/static/app.css">
<script>window.PC_TOKEN = "__TOKEN__";</script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8AB4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>
      <span>사진 정리</span>
    </div>
    <label class="drive">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#AEB4BC" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="2" y="7" width="20" height="10" rx="2"/><path d="M6 12h.01M10 12h.01"/></svg>
      <span class="sr-only">드라이브 선택</span>
      <select id="root-select"></select>
      <span id="disk-usage" class="muted"></span>
    </label>
    <button id="open-folder" class="btn btn-sm">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      폴더 열기
    </button>
    <span id="path-label" class="muted path-label"></span>
  </header>

  <div class="body">
    <nav class="sidebar" aria-label="폴더 탐색기">
      <div class="search">
        <label for="folder-search">폴더 찾기</label>
        <div class="search-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9AA1AA" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="folder-search" type="text" placeholder="예: 2024-03, 제주" autocomplete="off">
        </div>
      </div>
      <div id="tree" class="tree scrolly" role="tree"></div>
    </nav>

    <main class="content">
      <section class="index" aria-label="사진 인덱스">
        <div class="index-head">
          <strong>인덱스</strong>
          <span id="index-title" class="muted"></span>
          <span class="spacer"></span>
          <span class="legend"><i class="lg-focus"></i>현재 사진</span>
          <span class="legend"><i class="lg-mark"></i>삭제 표시</span>
        </div>
        <div id="strip" class="strip scrollx"></div>
      </section>

      <div class="toolbar">
        <div class="seg" role="group" aria-label="보기 방식">
          <button id="view-single" data-view="single" aria-pressed="true">한 장</button>
          <button id="view-multi" data-view="multi" aria-pressed="false">나란히</button>
          <button id="view-grid" data-view="grid" aria-pressed="false">바둑판</button>
        </div>
        <label id="nup-wrap" class="opt" hidden>
          <span>장 수</span>
          <select id="nup">
            <option value="2">2장</option><option value="3">3장</option><option value="4">4장</option>
            <option value="5">5장</option><option value="6">6장</option><option value="8">8장</option>
          </select>
        </label>
        <label id="gsize-wrap" class="opt" hidden>
          <span>크기</span>
          <select id="gsize">
            <option value="s">작게</option><option value="m">보통</option><option value="l">크게</option>
          </select>
        </label>
        <button id="fs-btn" class="btn btn-sm" title="전체 화면 (F)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          전체 화면
        </button>
        <span class="spacer"></span>
        <span class="muted hint">← → 이동 · Space 삭제 표시 · 휠 확대 · F 전체 화면</span>
        <span id="pos" class="muted tabnum"></span>
      </div>

      <div id="main" class="main scrolly">
        <div id="empty" class="empty" hidden>
          <span class="empty-title">왼쪽에서 사진 폴더를 선택하세요</span>
          <span class="muted">날짜별 폴더를 열면 사진이 여기에 표시됩니다</span>
        </div>

        <div id="single" class="single" hidden>
          <div class="stage">
            <button id="prev" class="nav-btn" aria-label="이전 사진"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E6E8EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
            <div class="frame-wrap">
              <div id="big" class="big">
                <img id="big-img" alt="">
                <div id="big-noprev" class="noprev" hidden></div>
                <div class="mark-pill" aria-hidden="true">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A0E0A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
                  삭제 표시됨
                </div>
              </div>
            </div>
            <button id="next" class="nav-btn" aria-label="다음 사진"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E6E8EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
          </div>
          <div class="info">
            <div class="info-text">
              <strong id="info-name"></strong>
              <span id="info-meta" class="muted"></span>
            </div>
            <span class="spacer"></span>
            <div class="zoomctl" role="group" aria-label="확대/축소">
              <button id="zoom-out" aria-label="축소 (-)">−</button>
              <button id="zoom-label" class="zlabel" title="창에 맞춤 (0)">맞춤</button>
              <button id="zoom-in" aria-label="확대 (+)">+</button>
            </div>
            <button id="toggle-btn" class="toggle-btn">삭제 표시</button>
          </div>
        </div>

        <div id="multi" class="multi" hidden></div>

        <div id="grid" class="grid" hidden></div>
      </div>

      <div class="actionbar">
        <span class="summary"><strong id="marked-count" class="accent">0장</strong> 삭제 표시 · <span id="marked-size">0MB</span></span>
        <span class="spacer"></span>
        <button id="mark-all" class="btn">모두 표시</button>
        <button id="clear-all" class="btn">표시 해제</button>
        <button id="delete-btn" class="btn-danger" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
          삭제
        </button>
      </div>
    </main>
  </div>

  <div id="dialog" class="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <h2 id="dlg-title"></h2>
      <p id="dlg-desc" class="muted"></p>
      <div id="dlg-list" class="dlg-list scrolly"></div>
      <label class="check"><input id="dlg-permanent" type="checkbox"> 휴지통을 거치지 않고 영구 삭제</label>
      <div class="dlg-actions">
        <button id="dlg-cancel" class="btn">취소</button>
        <button id="dlg-ok" class="btn-danger">휴지통으로 이동</button>
      </div>
    </div>
  </div>

  <div id="fs" class="fs" role="dialog" aria-modal="true" aria-label="전체 화면 보기" hidden>
    <div id="fs-stage" class="fs-stage">
      <img id="fs-img" alt="">
      <div id="fs-noprev" class="noprev" hidden></div>
      <div class="mark-pill" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A0E0A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
        삭제 표시됨
      </div>
    </div>
    <button id="fs-prev" class="nav-btn fs-nav fs-left" aria-label="이전 사진"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E6E8EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button id="fs-next" class="nav-btn fs-nav fs-right" aria-label="다음 사진"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E6E8EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    <div class="fs-bar">
      <span id="fs-pos" class="tabnum"></span>
      <span id="fs-name" class="fs-name"></span>
      <span class="spacer"></span>
      <div class="zoomctl" role="group" aria-label="확대/축소">
              <button id="fs-zoom-out" aria-label="축소 (-)">−</button>
              <button id="fs-zoom-label" class="zlabel" title="창에 맞춤 (0)">맞춤</button>
              <button id="fs-zoom-in" aria-label="확대 (+)">+</button>
            </div>
      <button id="fs-toggle" class="toggle-btn">삭제 표시</button>
      <button id="fs-close" class="btn">닫기 (Esc)</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
